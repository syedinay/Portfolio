<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>
<meta name="description" content="Backend engineer portfolio" />
<link rel="icon" href="data:," />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=20260909" />
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<main class="wrap">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-diagram" aria-hidden="true">
      <svg viewBox="0 0 220 140" width="220" height="140">
        <g class="node-lines">
          <line x1="30" y1="30" x2="110" y2="70"></line>
          <line x1="110" y1="70" x2="190" y2="30"></line>
          <line x1="110" y1="70" x2="60" y2="120"></line>
          <line x1="110" y1="70" x2="170" y2="115"></line>
          <line x1="30" y1="30" x2="60" y2="120"></line>
        </g>
        <g class="node-dots">
          <circle cx="30" cy="30" r="4"></circle>
          <circle cx="110" cy="70" r="5" class="node-core"></circle>
          <circle cx="190" cy="30" r="4"></circle>
          <circle cx="60" cy="120" r="4"></circle>
          <circle cx="170" cy="115" r="4"></circle>
        </g>
      </svg>
    </div>

    <p class="eyebrow" id="hero-location"></p>
    <h1 id="hero-name"></h1>
    <p class="hero-role" id="hero-role"></p>
    <p class="hero-tagline" id="hero-tagline"></p>

    <div class="hero-links" id="hero-links"></div>
  </section>

  <!-- ABOUT -->
  <section class="section">
    <h2>About</h2>
    <p id="about-text"></p>
  </section>

  <!-- SKILLS -->
  <section class="section">
    <h2>Skills</h2>
    <div id="skills-list" class="skills-list"></div>
  </section>

  <!-- EXPERIENCE -->
  <section class="section">
    <h2>Experience</h2>
    <div id="experience-list" class="timeline"></div>
  </section>

  <!-- PROJECTS -->
  <section class="section">
    <h2>Projects</h2>
    <div id="projects-list" class="projects-list"></div>
  </section>

  <!-- CONTACT / FOOTER -->
  <footer class="footer">
    <div class="footer-main">
      <h2>Get in touch</h2>
      <p id="footer-text"></p>
    </div>
    <div class="footer-links" id="footer-links"></div>
  </footer>

  <div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>

</main>

<script src="content.js?v=20260909"></script>
<script src="script.js?v=20260909"></script>
</body>
</html>
